apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: auth
  name: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - image: us-east4-docker.pkg.dev/rugged-weaver-446607-j8/authentication/production
          name: auth
          env:
            - name: DATASOURCE_URL
              value: 'postgresql://postgres:postgres@database:5432/postgres'
            - name: JWT_SECRET
              value: ''
            - name: JWT_EXPIRATION
              value: "3600"
            - name: TCP_PORT
              value: "3002"
            - name: HTTP_PORT
              value: "3003"
          ports:
            - containerPort: 3002
            - containerPort: 3003
